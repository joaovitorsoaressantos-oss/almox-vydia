<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vydia Tecnologia - Controle de Entregas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .signature-canvas {
            border: 2px dashed #cbd5e1;
            border-radius: 0.5rem;
            background-color: #ffffff;
            touch-action: none;
            cursor: crosshair;
            width: 100%;
            height: 140px;
        }
        @media print {
            body * {
                visibility: hidden !important;
            }
            #print-area, #print-area *, #print-area img {
                visibility: visible !important;
            }
            #print-area {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                background: white !important;
                color: black !important;
                display: block !important;
                z-index: 999999 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- APLICATIVO PRINCIPAL -->
    <div id="app-screen" class="flex-1 flex flex-col">
        <!-- CABEÇALHO -->
        <header class="bg-slate-950 border-b border-slate-800 py-4 px-6 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <div class="font-black text-cyan-400 text-lg tracking-wide">VYDIA TECNOLOGIA</div>
                <div>
                    <h1 class="font-bold text-sm text-white">Vydia Tecnologia</h1>
                    <p class="text-[10px] text-slate-400">Termo de Entrega de Materiais</p>
                </div>
            </div>
        </header>

        <!-- CONTEÚDO -->
        <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">
            
            <!-- BARRA DE NAVEGAÇÃO (ABAS) -->
            <div class="flex space-x-3 mb-6 bg-slate-800 p-2 rounded-2xl border border-slate-700">
                <button id="btn-tab-form" onclick="mudarAba('form')" class="flex-1 py-3 px-4 bg-cyan-600 text-white font-semibold rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2">
                    ✍️ Novo Termo
                </button>
                <button id="btn-tab-history" onclick="mudarAba('history')" class="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl transition duration-200 flex items-center justify-center gap-2">
                    📂 Arquivos Salvos
                </button>
            </div>

            <!-- SECÇÃO 1: FORMULÁRIO -->
            <div id="secao-form" class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg block">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <span>📄</span> Preencher Termo de Entrega
                </h2>

                <form id="termo-form" onsubmit="salvarTermo(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Retirado por (Nome)</label>
                            <input type="text" id="cliente" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-cyan-500 text-sm" placeholder="Ex: Carlos Alberto">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Data da Entrega</label>
                            <input type="date" id="data" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-cyan-500 text-sm">
                        </div>
                    </div>

                    <!-- SEÇÃO DE MATERIAIS DINÂMICA -->
                    <div class="bg-slate-900/60 border border-slate-700/60 p-4 rounded-xl space-y-3">
                        <div class="flex justify-between items-center">
                            <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider">Detalhamento dos Materiais</label>
                            <button type="button" onclick="adicionarLinhaMaterial()" class="text-xs bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                                ➕ Adicionar Item
                            </button>
                        </div>
                        
                        <!-- LISTA DE ITENS -->
                        <div id="lista-materiais" class="space-y-3">
                            <!-- Os itens serão injetados aqui via JavaScript -->
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Responsável Técnico (Vydia)</label>
                        <input type="text" id="responsavel" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-cyan-500 text-sm" placeholder="Seu Nome">
                    </div>

                    <!-- ASSINATURAS -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-700">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-medium text-slate-300">Assinatura de Quem Retirou</label>
                                <button type="button" onclick="limparAssinatura('cliente')" class="text-[10px] text-cyan-400 hover:underline">Limpar</button>
                            </div>
                            <canvas id="canvas-cliente" class="signature-canvas"></canvas>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-medium text-slate-300">Assinatura do Responsável (Vydia)</label>
                                <button type="button" onclick="limparAssinatura('responsavel')" class="text-[10px] text-cyan-400 hover:underline">Limpar</button>
                            </div>
                            <canvas id="canvas-responsavel" class="signature-canvas"></canvas>
                        </div>
                    </div>

                    <button type="submit" class="w-full mt-6 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-xl shadow-lg transition duration-200">
                        💾 Salvar e Enviar Termo
                    </button>
                </form>
            </div>

            <!-- SECÇÃO 2: HISTÓRICO -->
            <div id="secao-history" class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <span>📊</span> Termos Registrados na Nuvem
                    </h2>
                    <button onclick="carregarTermos()" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg transition">
                        🔄 Atualizar Lista
                    </button>
                </div>
                <div id="historico-list" class="space-y-3 text-sm text-slate-300">
                    <p class="text-slate-500 text-center py-4">Carregando termos do Supabase...</p>
                </div>
            </div>
        </main>

        <!-- RODAPÉ FIXO DE AUTORIA -->
        <footer class="bg-slate-950 border-t border-slate-800 py-3 text-center text-[11px] text-slate-500 mt-auto">
            Criado por João Vitor Soares dos santos
        </footer>
    </div>

    <!-- ÁREA DE IMPRESSÃO / SALVAR PDF -->
    <div id="print-area" style="display: none;"></div>

    <script>
        const SUPABASE_URL = "https://jjsifunoceyaglxfazfz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_DsKS0aHSTZ0B29CPyzKnvw_0JroV6nq";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('data').valueAsDate = new Date();
            initSignatures();
            adicionarLinhaMaterial(); // Começa com 1 linha de material por defeito
            carregarTermos();
        });

        // --- GESTÃO DE MÚLTIPLOS MATERIAIS ---
        function adicionarLinhaMaterial(qtd = '', unidade = 'Metros (m)', descricao = '') {
            const container = document.getElementById('lista-materiais');
            const rowId = 'mat-row-' + Date.now() + Math.random();

            const row = document.createElement('div');
            row.id = rowId;
            row.className = "grid grid-cols-1 sm:grid-cols-12 gap-2 items-center bg-slate-900/40 p-2 rounded-xl border border-slate-800";
            
            row.innerHTML = `
                <div class="sm:col-span-3">
                    <label class="block text-[10px] text-slate-400 sm:hidden">Quantidade</label>
                    <input type="text" class="mat-qtd w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-cyan-500 text-sm" placeholder="Qtd" value="${qtd}" required>
                </div>
                <div class="sm:col-span-4">
                    <label class="block text-[10px] text-slate-400 sm:hidden">Unidade</label>
                    <select class="mat-unidade w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-cyan-500 text-sm">
                        <option value="Metros (m)" ${unidade === 'Metros (m)' ? 'selected' : ''}>Metros (m)</option>
                        <option value="Unidades (un)" ${unidade === 'Unidades (un)' ? 'selected' : ''}>Unidades (un)</option>
                        <option value="Peças (pç)" ${unidade === 'Peças (pç)' ? 'selected' : ''}>Peças (pç)</option>
                        <option value="Bobinas (bob)" ${unidade === 'Bobinas (bob)' ? 'selected' : ''}>Bobinas (bob)</option>
                        <option value="Rolos (rl)" ${unidade === 'Rolos (rl)' ? 'selected' : ''}>Rolos (rl)</option>
                        <option value="Quilogramas (kg)" ${unidade === 'Quilogramas (kg)' ? 'selected' : ''}>Quilogramas (kg)</option>
                        <option value="Litros (L)" ${unidade === 'Litros (L)' ? 'selected' : ''}>Litros (L)</option>
                    </select>
                </div>
                <div class="sm:col-span-4">
                    <label class="block text-[10px] text-slate-400 sm:hidden">Descrição</label>
                    <input type="text" class="mat-descricao w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-cyan-500 text-sm" placeholder="Descrição do item" value="${descricao}" required>
                </div>
                <div class="sm:col-span-1 text-right">
                    <button type="button" onclick="removerLinhaMaterial('${rowId}')" class="w-full sm:w-auto text-red-400 hover:text-red-300 p-2 text-center transition font-bold" title="Remover item">✕</button>
                </div>
            `;
            container.appendChild(row);
        }

        function removerLinhaMaterial(rowId) {
            const container = document.getElementById('lista-materiais');
            if (container.children.length > 1) {
                document.getElementById(rowId).remove();
            } else {
                alert('O termo precisa de ter pelo menos um material.');
            }
        }

        // --- LÓGICA DAS ABAS ---
        function mudarAba(abaDestino) {
            const secForm = document.getElementById('secao-form');
            const secHist = document.getElementById('secao-history');
            const btnForm = document.getElementById('btn-tab-form');
            const btnHist = document.getElementById('btn-tab-history');

            const btnAtivo = "flex-1 py-3 px-4 bg-cyan-600 text-white font-semibold rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2";
            const btnInativo = "flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl transition duration-200 flex items-center justify-center gap-2";

            if (abaDestino === 'form') {
                secForm.classList.remove('hidden');
                secHist.classList.add('hidden');
                btnForm.className = btnAtivo;
                btnHist.className = btnInativo;
            } else {
                secForm.classList.add('hidden');
                secHist.classList.remove('hidden');
                btnHist.className = btnAtivo;
                btnForm.className = btnInativo;
                carregarTermos();
            }
        }

        // --- LÓGICA DO CANVAS DE ASSINATURA ---
        let sigCliente, sigResponsavel;
        function initSignatures() {
            sigCliente = setupCanvas('canvas-cliente');
            sigResponsavel = setupCanvas('canvas-responsavel');
        }

        function setupCanvas(id) {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            let painting = false;
            let hasDrawn = false;

            function initCanvasSize() {
                canvas.width = 700;
                canvas.height = 200;
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                hasDrawn = false;
            }
            
            initCanvasSize();

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { 
                    x: (clientX - rect.left) * (canvas.width / rect.width), 
                    y: (clientY - rect.top) * (canvas.height / rect.height) 
                };
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseleave', stop);

            canvas.addEventListener('touchstart', start);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stop);

            function start(e) {
                painting = true;
                hasDrawn = true;
                ctx.beginPath();
                const pos = getPos(e);
                ctx.moveTo(pos.x, pos.y);
                e.preventDefault();
            }

            function draw(e) {
                if (!painting) return;
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                e.preventDefault();
            }

            function stop() {
                painting = false;
            }

            return {
                clear: () => {
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    hasDrawn = false;
                },
                isEmpty: () => !hasDrawn,
                getData: () => canvas.toDataURL('image/png')
            };
        }

        function limparAssinatura(tipo) {
            if (tipo === 'cliente') sigCliente.clear();
            if (tipo === 'responsavel') sigResponsavel.clear();
        }

        // --- SALVAR NO SUPABASE ---
        async function salvarTermo(e) {
            e.preventDefault();
            if (sigCliente.isEmpty() || sigResponsavel.isEmpty()) {
                alert('Por favor, colete ambas as assinaturas antes de salvar.');
                return;
            }

            // Recolher todos os materiais preenchidos
            const linhas = document.querySelectorAll('#lista-materiais > div');
            const listaMateriaisObj = [];

            linhas.forEach(linha => {
                const qtd = linha.querySelector('.mat-qtd').value.trim();
                const unidade = linha.querySelector('.mat-unidade').value;
                const desc = linha.querySelector('.mat-descricao').value.trim();
                if(qtd && desc) {
                    listaMateriaisObj.push({ qtd, unidade, descricao: desc });
                }
            });

            if (listaMateriaisObj.length === 0) {
                alert('Adicione pelo menos um material válido.');
                return;
            }

            const dados = {
                cliente: document.getElementById('cliente').value.trim(),
                material: JSON.stringify(listaMateriaisObj), // Guarda como JSON para suportar múltiplos itens
                data: document.getElementById('data').value,
                responsavel: document.getElementById('responsavel').value.trim(),
                assinatura_cliente: sigCliente.getData(),
                assinatura_responsavel: sigResponsavel.getData()
            };

            const { error } = await supabaseClient.from('termos_vydia').insert([dados]);
            if (error) {
                alert('Erro ao salvar no Supabase: ' + error.message);
            } else {
                alert('Termo salvo com sucesso na nuvem!');
                
                document.getElementById('termo-form').reset();
                document.getElementById('data').valueAsDate = new Date();
                document.getElementById('lista-materiais.innerHTML = ""');
                document.getElementById('lista-materiais').innerHTML = '';
                adicionarLinhaMaterial();
                sigCliente.clear();
                sigResponsavel.clear();
                
                mudarAba('history');
            }
        }

        async function carregarTermos() {
            const listDiv = document.getElementById('historico-list');
            listDiv.innerHTML = `<p class="text-slate-500 text-center py-4">Carregando termos do Supabase...</p>`;
            
            const { data, error } = await supabaseClient.from('termos_vydia').select('*').order('id', { ascending: false });
            
            if (error) {
                listDiv.innerHTML = `<p class="text-red-400 text-center">Erro ao carregar histórico: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listDiv.innerHTML = `<p class="text-slate-500 text-center py-4">Nenhum termo cadastrado ainda.</p>`;
                return;
            }

            window.termosCache = data;

            listDiv.innerHTML = data.map((item, index) => {
                let resumoMaterial = item.material;
                try {
                    const parsed = JSON.parse(item.material);
                    if(Array.isArray(parsed)) {
                        resumoMaterial = parsed.map(m => `${m.qtd} ${m.unidade} - ${m.descricao}`).join(' | ');
                    }
                } catch(e) {}

                return `
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div>
                            <strong class="text-white">Retirado por: ${item.cliente}</strong>
                            <p class="text-xs text-slate-400">Data: ${item.data} | Resp: ${item.responsavel}</p>
                            <p class="text-xs text-slate-300 mt-1">Materiais: ${resumoMaterial}</p>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                            <button onclick="imprimirTermo(${index})" class="text-xs bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1 cursor-pointer">
                                🖨️ Gerar PDF
                            </button>
                            <button onclick="excluirTermo(${index})" class="text-xs bg-red-600/80 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1 cursor-pointer">
                                🗑️ Apagar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function excluirTermo(index) {
            const item = window.termosCache[index];
            if (!confirm(`Tem certeza que deseja apagar o termo de "${item.cliente}" (${item.data})?`)) return;

            const query = supabaseClient.from('termos_vydia').delete();
            const { error } = item.id ? await query.eq('id', item.id) : await query.eq('cliente', item.cliente).eq('data', item.data);

            if (error) {
                alert('Erro ao excluir: ' + error.message);
            } else {
                alert('Termo apagado com sucesso!');
                carregarTermos();
            }
        }

        // --- GERAÇÃO DE PDF (IMPRESSÃO) ---
        async function imprimirTermo(index) {
            const item = window.termosCache[index];
            const printArea = document.getElementById('print-area');
            
            const assCliente = item.assinatura_cliente || item.assinatura_client || '';
            const assResp = item.assinatura_responsavel || '';

            // Processar materiais (suporta formato antigo em texto e novo em lista JSON)
            let htmlMateriais = '';
            try {
                const parsed = JSON.parse(item.material);
                if(Array.isArray(parsed)) {
                    htmlMateriais = parsed.map((m, i) => `
                        <div style="padding: 8px 12px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 14px;">
                            <span><strong>${i+1}.</strong> ${m.descricao}</span>
                            <span><strong>${m.qtd}</strong> ${m.unidade}</span>
                        </div>
                    `).join('');
                } else {
                    htmlMateriais = `<div style="padding: 10px; font-size: 14px; font-weight: bold;">${item.material}</div>`;
                }
            } catch(e) {
                htmlMateriais = `<div style="padding: 10px; font-size: 14px; font-weight: bold;">${item.material}</div>`;
            }

            printArea.innerHTML = `
                <div style="font-family: Arial, sans-serif; max-width: 750px; margin: 0 auto; color: #000; padding: 30px; background: #fff;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0f172a; padding-bottom: 12px; margin-bottom: 20px;">
                        <div>
                            <h2 style="margin: 0; font-size: 22px; color: #0f172a; font-weight: bold;">VYDIA TECNOLOGIA</h2>
                            <p style="margin: 2px 0 0 0; font-size: 12px; color: #555;">Termo de Entrega e Recebimento de Materiais</p>
                        </div>
                        <div style="text-align: right; font-size: 12px;">
                            <strong>Data:</strong> ${item.data}
                        </div>
                    </div>

                    <div style="margin-bottom: 20px; font-size: 13px; line-height: 1.5;">
                        <p style="margin: 3px 0;"><strong>Retirado por (Nome):</strong> ${item.cliente}</p>
                        <p style="margin: 3px 0;"><strong>Responsável Técnico (Vydia):</strong> ${item.responsavel}</p>
                    </div>

                    <div style="margin-bottom: 25px;">
                        <strong style="font-size: 13px; display: block; margin-bottom: 6px; color: #0f172a;">Descrição dos Materiais Entregues:</strong>
                        <div style="border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; overflow: hidden; color: #0f172a;">
                            ${htmlMateriais}
                        </div>
                    </div>

                    <p style="font-size: 12px; line-height: 1.5; margin-bottom: 40px; text-align: justify; color: #334155;">
                        Declaramos para os devidos fins que os materiais descritos neste documento foram entregues em perfeito estado e conferidos, ficando o recebedor responsável pela sua guarda e conservação a partir desta data.
                    </p>

                    <table style="width: 100%; margin-top: 40px; border-collapse: collapse;">
                        <tr>
                            <td style="width: 48%; text-align: center; vertical-align: bottom;">
                                <div style="border-bottom: 1px solid #334155; height: 90px; text-align: center; margin-bottom: 5px; background: #fff;">
                                    ${assCliente ? `<img src="${assCliente}" style="height: 85px; max-width: 100%; display: inline-block; vertical-align: bottom;" />` : '<span style="font-size:11px; color:#aaa;">Sem assinatura</span>'}
                                </div>
                                <p style="margin: 0; font-size: 12px; font-weight: bold; color: #0f172a;">Assinatura do Retirante</p>
                                <p style="margin: 2px 0 0 0; font-size: 11px; color: #64748b;">${item.cliente}</p>
                            </td>
                            <td style="width: 4%;"></td>
                            <td style="width: 48%; text-align: center; vertical-align: bottom;">
                                <div style="border-bottom: 1px solid #334155; height: 90px; text-align: center; margin-bottom: 5px; background: #fff;">
                                    ${assResp ? `<img src="${assResp}" style="height: 85px; max-width: 100%; display: inline-block; vertical-align: bottom;" />` : '<span style="font-size:11px; color:#aaa;">Sem assinatura</span>'}
                                </div>
                                <p style="margin: 0; font-size: 12px; font-weight: bold; color: #0f172a;">Responsável Técnico (Vydia)</p>
                                <p style="margin: 2px 0 0 0; font-size: 11px; color: #64748b;">${item.responsavel}</p>
                            </td>
                        </tr>
                    </table>

                    <div style="margin-top: 50px; text-align: center; font-size: 10px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 10px;">
                        Criado por João Vitor Soares dos santos - Sistema Vydia Tecnologia
                    </div>
                </div>
            `;

            printArea.style.display = 'block';

            const imgs = Array.from(printArea.querySelectorAll('img'));
            await Promise.all(imgs.map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => {
                    img.onload = resolve;
                    img.onerror = resolve;
                });
            }));

            setTimeout(() => {
                window.print();
                printArea.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
